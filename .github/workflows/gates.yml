name: gates

on: [push, pull_request]

jobs:
  gates:
    # fail-fast off: "does it work off Windows" is the question, so a red Linux
    # must not hide the macOS answer.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        # package.json declares engines >=22, so the newest major is part of the
        # promise and an untested promise is the same as no promise. One extra
        # job carries it: the native better-sqlite3 build is the only thing a
        # Node major realistically breaks, and Windows-on-26 is already covered
        # by the local gate runs recorded in docs/PORTABILITY.md.
        include:
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The five gates. None reads an API key or makes a network call (README
      # §"What is verified, end-to-end, with zero API calls"), which is exactly
      # what makes them runnable here.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check-leaks
      - run: npm run demo
      - run: npm run verify-fixtures
